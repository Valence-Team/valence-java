spring.application.name=valence-api
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

# Banco de dados
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Requisições
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Segurança
valence.jwt.secret=${JWT_SECRET:}
valence.jwt.expiracao-minutos=${JWT_EXPIRATION_MINUTES:120}
valence.jwt.emissor=valence-api
valence.cors.origens=${CORS_ORIGENS:}
valence.seed.habilitado=true

# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URI:amqp://guest:guest@localhost:5672}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
valence.rabbitmq.exchange=valence.eventos
valence.rabbitmq.fila-alertas=valence.java.alertas
valence.rabbitmq.rk-ocorrencia-triada=ocorrencia.triada
valence.rabbitmq.rk-laudo-emitido=laudo.emitido

# Serviço de IA (visão computacional e RAG)
valence.ia.url=${IA_SERVICE_URL:http://localhost:8000}
valence.ia.timeout-segundos=${IA_TIMEOUT_SECONDS:10}
valence.ia.api-key=${IA_API_KEY:}
valence.ia.confianca-minima=${IA_CONFIANCA_MINIMA:0.6}

# Alertas e triagem
valence.alerta.raio-km=${ALERTA_RAIO_KM:10}
valence.triagem.agendador.habilitado=true
valence.triagem.agendador.intervalo-ms=60000
valence.triagem.espera-foto-minutos=10
valence.fotos.diretorio=${FOTOS_DIR:./data/fotos}

# Spring AI com provedor compatível com a API da OpenAI (Groq por padrão)
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${LLM_API_KEY:sem-chave-configurada}
spring.ai.openai.chat.completions-path=${LLM_COMPLETIONS_PATH:/v1/chat/completions}
spring.ai.openai.chat.options.model=${LLM_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.reasoning-effort=${LLM_REASONING_EFFORT:low}
spring.ai.retry.max-attempts=1
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=${LLM_TIMEOUT_SECONDS:20}s

# Documentação
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Monitoramento
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.nome=Valence API
info.app.descricao=Rede pública de vigilância fitossanitária para pequenos produtores
info.app.versao=1.0.0
